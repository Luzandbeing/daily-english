it's broad enough to include someone living in their tent.","zh":"它的含义足够广泛，可以包括住在自己帐篷里的人"},{"n":344,"page":13,"en":"It means instead of receiving the base amount, roughly $400 a month,","zh":"这意味着，一个住帐篷的人不应只领取约每月400加元的基本金额，"},{"n":345,"page":13,"en":"a person living in a tent should qualify for more than $900.","zh":"而应有资格获得超过900加元"},{"n":346,"page":14,"en":"Money that allows someone some human dignity and a step in stone towards being able to live healthy, normal lives.","zh":"这笔钱能让人拥有些许人的尊严，是朝着能够过上健康、正常生活迈出的坚实一步"},{"n":347,"page":14,"en":"More than 2,000 people in Halifax alone don't have a place to live.","zh":"仅在哈利法克斯，就有超过2000人没有住所"},{"n":348,"page":14,"en":"But the province has to make a decision here","zh":"但省政府必须在此做出决定，"},{"n":349,"page":14,"en":"whether to continue to fight it all the way to the Supreme Court","zh":"是继续抗争，一直打到最高法院，"},{"n":350,"page":14,"en":"or to enact the rules as decided by the court or change legislation.","zh":"还是按照法庭的裁决执行规则，或者修改立法"},{"n":351,"page":14,"en":"So we have a lot to unpack in terms of this decision.","zh":"所以，关于这项判决，我们有很多需要剖析的地方"},{"n":352,"page":14,"en":"It may be, you know, looking at our current legislation and regulations,","zh":"你知道，这可能意味着要审视我们现行的立法和法规，"},{"n":353,"page":14,"en":"whether we have to make changes.","zh":"看看我们是否必须做出修改"},{"n":354,"page":14,"en":"The minister insists any changes would be designed to help homeless Nova Scotians get into stable housing.","zh":"部长坚称，任何改变都将旨在帮助无家可归的新斯科舍省人获得稳定住房"},{"n":355,"page":14,"en":"If they somehow tried to rewrite the regulations to undermine this victory,","zh":"如果他们试图以某种方式重写法规来破坏这场胜利，"},{"n":356,"page":14,"en":"that would be extremely cruel.","zh":"那将是极其残忍的"},{"n":357,"page":14,"en":"Oh, good boy!","zh":"哦，好孩子！"},{"n":358,"page":14,"en":"Andrew Goodsell lived in a tent for more than two years until he finally found a home this week. Andrew Goodsell","zh":"在帐篷里住了两年多，直到本周他才终于找到了一个家"},{"n":359,"page":14,"en":"And he believes the province isn't doing enough quickly enough.","zh":"他认为省政府做得还不够，行动也不够快"},{"n":360,"page":14,"en":"Let's talk about 35-plus years of no public housing.","zh":"让我们来谈谈这超过35年没有公共住房的情况"},{"n":361,"page":14,"en":"People that are looking to reach their best need to have their basic needs met.","zh":"试图达到巅峰的人，需要先满足基本需求"},{"n":362,"page":14,"en":"Lowe will never see the money.","zh":"洛将永远看不到那笔钱"},{"n":363,"page":14,"en":"He died in his tent downtown two months after he was initially turned down for the extra support.","zh":"他在初次申请额外补助被拒两个月后，死在了市中心的帐篷里"},{"n":364,"page":14,"en":"His mother continued with the case in his name in the hopes of helping others like him.","zh":"他的母亲以他的名义继续这场官司，希望能帮助其他像他一样的人"},{"n":365,"page":14,"en":"Heidi Petrochik, Global News, Halifax.","zh":"海蒂·彼得罗奇克，环球新闻，哈利法克斯报道"},{"n":366,"page":14,"en":"Up next, why a species of seahorse was just named after a B.C. professor.","zh":"接下来，为什么一种海马刚以一位不列颠哥伦比亚省教授的名字命名"},{"n":367,"page":15,"en":"Welcome back.","zh":"欢迎回来"},{"n":368,"page":15,"en":"A professor from British Columbia is making a name for herself.","zh":"一位来自不列颠哥伦比亚省的教授正声名鹊起"},{"n":369,"page":15,"en":"Amanda Vincent has conducted decades of research and conservation efforts for marine life.","zh":"阿曼达·文森特在海洋生物研究和保护方面付出了数十年的努力"},{"n":370,"page":15,"en":"And in recognition of those efforts,","zh":"为了表彰这些努力，"},{"n":371,"page":15,"en":"a newly identified species of seahorse will now be named after her.","zh":"一个新发现的海马物种将以她的名字命名"},{"n":372,"page":15,"en":"Kylie Stanton reports on the rare honour.","zh":"凯莉·斯坦顿报道这一罕见的荣誉"},{"n":373,"page":15,"en":"From the beginning, the goal was simple.","zh":"从一开始，目标就很简单"},{"n":374,"page":15,"en":"I really wanted to get involved in helping to save the world.","zh":"我真的想投身于拯救世界的事业"},{"n":375,"page":15,"en":"But sometimes big ambitions start small.","zh":"但有时，宏大的抱负始于细微之处"},{"n":376,"page":15,"en":"We're involved in pioneering a lot of breakthroughs because who doesn't love a seahorse?","zh":"我们参与开创了许多突破，因为谁不喜欢海马呢？"},{"n":377,"page":15,"en":"For decades, Amanda Vincent has been working to secure the future of these creatures and their habitats.","zh":"几十年来，阿曼达·文森特一直致力于保护这些生物及其栖息地的未来"},{"n":378,"page":15,"en":"As co-founder of UBC's Project Seahorse, she helps lead a global team in research,","zh":"作为UBC海马项目的联合创始人，她领导着一支全球团队进行研究、"},{"n":379,"page":15,"en":"conservation and policy,","zh":"保护和政策制定，"},{"n":380,"page":15,"en":"which includes ensuring seahorses aren't over-harvested for traditional medicine, aquarium displays or the souvenir trade.","zh":"包括确保海马不会因传统医药、水族观赏或纪念品贸易而被过度捕捞"},{"n":381,"page":15,"en":"Fishing is necessary.","zh":"捕鱼是必要的"},{"n":382,"page":15,"en":"Fishing is vital.","zh":"捕鱼至关重要"},{"n":383,"page":15,"en":"But it's got to be done in sustainable, sensible ways.","zh":"但必须以可持续、合理的方式进行"},{"n":384,"page":15,"en":"And this means we work at a lot of different political levels from local communities right out to United Nations conventions.","zh":"这意味着我们得在多个不同政治层面工作，从当地社区一直到联合国公约"},{"n":385,"page":15,"en":"Now her life's work is being recognised in a way that runs deep.","zh":"现在，她一生的工作以一种深刻的方式得到了认可"},{"n":386,"page":15,"en":"This is my beautiful seahorse.","zh":"这是我美丽的海马"},{"n":387,"page":15,"en":"A newly identified species has been named Hippocampus Amanda Vincente in her honour.","zh":"一个新发现的物种被命名为“文森特海马”，以向她致敬"},{"n":388,"page":15,"en":"I'm thrilled.","zh":"我激动不已"},{"n":389,"page":15,"en":"It's pretty wonderful to wake up and open your email and discover just two days ago","zh":"醒来打开邮件，就在两天前发现"},{"n":390,"page":16,"en":"that there is a creature on the other side of the world that is beautiful and wonderful and special and has your name on it.","zh":"世界的另一边有一种美丽、奇妙又特别的生物，并且以你的名字命名，这真是太美好了"},{"n":391,"page":16,"en":"The seahorse measures roughly 16 centimetres.","zh":"这种海马长约16厘米"},{"n":392,"page":16,"en":"It has a short snout,","zh":"它有一个短吻，"},{"n":393,"page":16,"en":"a small crown on top of its head and spines running along its body.","zh":"头顶有一个小冠，身体上有一排排的棘刺"},{"n":394,"page":16,"en":"Researchers believe it's primarily located in the Indian Ocean.","zh":"研究人员认为它主要生活在印度洋"},{"n":395,"page":16,"en":"And that's really all we know at this stage because it has not been investigated in the wild.","zh":"目前我们了解的就这么多，因为它还没有在野外被研究过"},{"n":396,"page":16,"en":"Cue the next mission.","zh":"这预示着下一个任务"},{"n":397,"page":16,"en":"Which is to get in the field with my glorious seahorse and actually learn about its ecology and its vulnerabilities","zh":"那就是去野外，与我光荣的海马一起，真正了解它的生态和脆弱性，"},{"n":398,"page":16,"en":"and conservation possibilities and try to make sure that all is well.","zh":"以及保护的可能性，并努力确保一切安好"},{"n":399,"page":16,"en":"Seahorses are under tremendous pressure.","zh":"海马承受着巨大的压力"},{"n":400,"page":16,"en":"Roughly a third of them are known to be threatened.","zh":"已知大约有三分之一的海马物种面临威胁"},{"n":401,"page":16,"en":"But with every discovery brings more understanding and a chance to turn the tides.","zh":"但每一次发现都带来更多理解，以及扭转局势的机会"},{"n":402,"page":16,"en":"We've got new approaches, new tools, new colleagues involved.","zh":"我们有新的方法、新的工具、新的同事加入"},{"n":403,"page":16,"en":"So it's very exciting to see that we're changing the trajectory by the passion and the hard work of a lot of people.","zh":"所以，看到我们正通过众多人的热情和努力改变发展轨迹，这非常令人兴奋"},{"n":404,"page":16,"en":"Kelly Stanton, Global News.","zh":"凯莉·斯坦顿，环球新闻"},{"n":405,"page":16,"en":"And that is Global National for this Saturday night.","zh":"以上就是本周六晚的《环球新闻》"},{"n":406,"page":16,"en":"I'm Jeff Sumpel.","zh":"我是杰夫·萨姆佩尔"},{"n":407,"page":16,"en":"And tonight's Your Canada is this country's largest street festival.","zh":"今晚的《你的加拿大》介绍的是这个国家最大的街头节庆"},{"n":408,"page":16,"en":"The Taste of the Danforth in Toronto's Greektown neighbourhood is making a comeback this weekend after a two-year hiatus.","zh":"多伦多希腊城社区的丹佛斯美食节在中断两年后，于本周末回归"},{"n":409,"page":16,"en":"Around one and a half million people are expected to sample the three-day celebration of Greek heritage.","zh":"预计将有约150万人参与这个为期三天的希腊文化遗产庆祝活动"},{"n":410,"page":16,"en":"Looking good.","zh":"看起来不错"},{"n":411,"page":17,"en":"Thanks for watching.","zh":"感谢收看"},{"n":412,"page":17,"en":"Hope to see you back here again tomorrow.","zh":"希望明天能再次见到你"},{"n":413,"page":17,"en":"Have a great night.","zh":"祝你度过一个美好的夜晚"}]}</script>
<script>
(function(){
  "use strict";
  var study = JSON.parse(document.getElementById("study-data").textContent || "{}");
  var transcript = JSON.parse(document.getElementById("transcript-data").textContent || "{}");
  var meta = study.meta || {};
  var vocab = study.vocab || [];
  var phrases = study.phrases || [];
  var grammar = study.grammar || [];
  var patterns = study.patterns || [];
  var exercises = study.exercises || [];
  var items = transcript.items || [];
  var stem = (transcript.source && (transcript.source.stem || transcript.source.name)) || "study";
  var STORE = "englishStudy:" + stem;

  /* ---------- state ---------- */
  var state = { mastered: {}, starred: {}, zh: true, rate: 0.85 };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || "{}");
    if (saved.mastered) state.mastered = saved.mastered;
    if (saved.starred) state.starred = saved.starred;
    if (typeof saved.zh === "boolean") state.zh = saved.zh;
    if (saved.rate) state.rate = saved.rate;
  } catch (e) { /* private mode: keep in-memory state */ }
  function persist(){
    try { localStorage.setItem(STORE, JSON.stringify(
      { mastered: state.mastered, starred: state.starred, zh: state.zh, rate: state.rate })); } catch (e) {}
  }

  /* ---------- helpers ---------- */
  function el(tag, cls, text){
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function esc(s){ return String(s == null ? "" : s); }
  function talk(text){
    if (!("speechSynthesis" in window) || !text) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text));
      u.lang = "en-US"; u.rate = state.rate;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function speakBtn(text, label){
    var b = el("button", "icon", label || "🔊");
    b.title = "朗读";
    b.addEventListener("click", function(){ talk(text); });
    return b;
  }
  function refLink(n){
    var a = el("a", "ref", "#" + n);
    a.href = "#s" + n;
    a.textContent = "第 " + n + " 句";
    return a;
  }
  function refs(list){
    var wrap = el("span", "ref");
    wrap.appendChild(document.createTextNode(" 例句："));
    (list || []).forEach(function(ref, i){
      if (i) wrap.appendChild(document.createTextNode("、"));
      var a = el("a", null, "#" + ref);
      a.href = "#s" + ref;
      wrap.appendChild(a);
    });
    return wrap;
  }
  function levelClass(level){
    var s = String(level || "").toLowerCase();
    if (s.indexOf("c1") >= 0 || s.indexOf("c2") >= 0 || s.indexOf("难") >= 0) return "lvl hi";
    if (s.indexOf("a1") >= 0 || s.indexOf("a2") >= 0) return "lvl core";
    return "lvl";
  }

  /* ---------- header ---------- */
  var stats = transcript.stats || {};
  document.title = (meta.title || stem) + " · 英语学习";
  document.getElementById("title").textContent = meta.title || stem;
  document.getElementById("subtitle").textContent =
    (meta.subtitle || transcript.source && transcript.source.name || "") +
    (meta.estimatedMinutes ? " · 建议 " + meta.estimatedMinutes + " 分钟" : "");
  var badges = document.getElementById("badges");
  function addBadge(html){ var b = el("div", "badge"); b.innerHTML = html; badges.appendChild(b); }
  if (meta.level) addBadge('<span class="lv">' + esc(meta.level) + "</span>");
  addBadge("句子 <strong>" + items.length + "</strong>");
  if (vocab.length) addBadge("生词 <strong>" + vocab.length + "</strong>");
  if (grammar.length) addBadge("语法 <strong>" + grammar.length + "</strong>");
  if (patterns.length) addBadge("句型 <strong>" + patterns.length + "</strong>");
  if (stats.englishWords) addBadge("英文 <strong>" + stats.englishWords + "</strong> 词");
  (meta.topics || []).forEach(function(t){ var c = el("span", "chip", t); badges.appendChild(c); });

  /* ---------- overview ---------- */
  var sc = document.getElementById("summary-card");
  if (meta.summary) {
    sc.appendChild(el("h3", null, "内容概览"));
    sc.appendChild(el("p", null, meta.summary));
  }
  if (meta.learningFocus && meta.learningFocus.length) {
    sc.appendChild(el("h3", null, "本篇学习重点"));
    var ul = el("ul");
    meta.learningFocus.forEach(function(x){ ul.appendChild(el("li", null, x)); });
    sc.appendChild(ul);
  }
  if (!sc.childNodes.length) sc.appendChild(el("p", "empty", "（study.json 里没有 meta.summary）"));

  var sg = document.getElementById("stat-grid");
  [["句子总数", items.length], ["生词", vocab.length], ["短语搭配", phrases.length],
   ["语法点", grammar.length], ["练习", exercises.length]].forEach(function(pair){
    var d = el("div", "stat");
    d.appendChild(el("b", null, String(pair[1])));
    d.appendChild(el("span", null, pair[0]));
    sg.appendChild(d);
  });

  var pc = document.getElementById("plan-card");
  if (meta.studyPlan && meta.studyPlan.length) {
    pc.appendChild(el("h3", null, "建议学习路径"));
    var ol = el("ol", "plan");
    meta.studyPlan.forEach(function(step){ ol.appendChild(el("li", null, step)); });
    pc.appendChild(ol);
  } else { pc.hidden = true; }

  /* ---------- vocab highlight index ---------- */
  var vindex = [];
  vocab.forEach(function(v){
    var term = String(v.term || "").trim();
    if (term.length < 3) return;
    var variants = [term].concat(v.forms || []);
    variants.forEach(function(t){
      var key = String(t).trim();
      if (key.length < 3) return;
      vindex.push({ re: new RegExp("\\b" + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i"), v: v });
    });
  });
  vindex.sort(function(a, b){ return b.re.source.length - a.re.source.length; });

  function highlight(text, withClass){
    var frag = document.createDocumentFragment();
    var rest = text, guard = 0;
    while (rest && guard++ < 60) {
      var best = null, bestEntry = null, bestIdx = -1;
      for (var i = 0; i < vindex.length; i++) {
        var m = vindex[i].re.exec(rest);
        if (m && (bestIdx === -1 || m.index < bestIdx)) {
          best = m; bestEntry = vindex[i].v; bestIdx = m.index;
        }
        if (bestIdx === 0) break;
      }
      if (!best) break;
      if (best.index > 0) frag.appendChild(document.createTextNode(rest.slice(0, best.index)));
      var mark = el("mark", withClass ? "v tagged" : "v", best[0]);
      mark.title = ((bestEntry && bestEntry.zh) || "") +
                   (bestEntry && bestEntry.pos ? "  " + bestEntry.pos : "");
      frag.appendChild(mark);
      rest = rest.slice(best.index + best[0].length);
    }
    if (rest) frag.appendChild(document.createTextNode(rest));
    return frag;
  }

  /* ---------- starred sentences (重点句收藏) ---------- */
  function starredItems(){
    return items.filter(function(it){ return !!state.starred[it.n]; });
  }
  function starToggleSync(){
    var btn = document.getElementById("star-toggle");
    if (!btn) return;
    btn.classList.toggle("on", document.getElementById("sent-filter").value === "star");
  }
  function syncStarUI(){
    var list = starredItems();
    var label = document.getElementById("star-count");
    if (label) label.textContent = String(list.length);
    var badge = document.getElementById("badge-starred");
    if (badge) badge.textContent = String(list.length);
    var head = document.getElementById("starred-count");
    if (head) head.textContent = list.length
      ? "已收藏 " + list.length + " 句（全篇 " + items.length + " 句）" : "";
    var preview = document.getElementById("star-preview");
    if (preview && !preview.hidden) {
      preview.textContent = list.length
        ? starredMarkdown()
        : "还没有收藏任何句子。先去「逐句精读」点句子右侧的 ☆，再回来导出。";
    }
    starToggleSync();
    if (document.getElementById("sent-filter").value === "star") renderSentences();
    var panel = document.getElementById("tab-starred");
    if (panel && !panel.hidden) renderStarred();
  }
  function toggleStar(n, btn){
    if (state.starred[n]) {
      delete state.starred[n];
      if (btn) {
        btn.textContent = "☆"; btn.classList.remove("on");
        btn.title = "收藏这句，之后可在「收藏句」里集中复习";
      }
    } else {
      state.starred[n] = 1;
      if (btn) { btn.textContent = "★"; btn.classList.add("on"); btn.title = "取消收藏"; }
    }
    persist();
    syncStarUI();
  }
  var starWrap = document.getElementById("starred");
  function renderStarred(){
    var list = starredItems();
    starWrap.textContent = "";
    if (!list.length) {
      starWrap.appendChild(el("p", "empty",
        "还没有收藏句子。切到「逐句精读」，点句子右侧的 ☆ 就能把重点句收进来，之后在这里集中复习或导出。"));
      return;
    }
    list.forEach(function(it){
      var box = el("div", "sent");
      box.id = "star-s" + it.n;
      var r1 = el("div", "row1");
      r1.appendChild(el("div", "no", String(it.n)));
      var body = el("div", "body");
      var en = el("div", "en");
      en.appendChild(highlight(it.en || "", true));
      body.appendChild(en);
      if (it.zh) body.appendChild(el("div", "zh", it.zh));
      r1.appendChild(body);
      var acts = el("div", "acts");
      acts.appendChild(speakBtn(it.en));
      var jump = el("button", "icon", "↗");
      jump.title = "在「逐句精读」中定位这句";
      jump.addEventListener("click", function(){ location.hash = "s" + it.n; });
      acts.appendChild(jump);
      var off = el("button", "icon on", "★");
      off.title = "取消收藏";
      off.addEventListener("click", function(){ toggleStar(it.n, off); });
      acts.appendChild(off);
      r1.appendChild(acts);
      r1.appendChild(el("div", "pg", "p" + (it.page || "")));
      box.appendChild(r1);
      starWrap.appendChild(box);
    });
  }
  function starredMarkdown(){
    var list = starredItems();
    var source = (transcript.source && transcript.source.name) || "";
    var lines = ["# " + (meta.title || stem) + " · 收藏句子", "",
                 "- 来源：" + source,
                 "- 收藏句数：" + list.length + " / " + items.length,
                 "", "---", ""];
    list.forEach(function(it){
      lines.push("### " + it.n + ". " + (it.en || ""));
      if (it.zh) lines.push("", "> " + it.zh);
      if (it.page) lines.push("", "（原文第 " + it.page + " 页）");
      lines.push("");
    });
    return lines.join("\n");
  }
  var exportBtn = document.getElementById("star-export");
  if (exportBtn) exportBtn.addEventListener("click", function(){
    var list = starredItems();
    var preview = document.getElementById("star-preview");
    preview.hidden = false;
    if (!list.length) {
      preview.textContent = "还没有收藏任何句子。先去「逐句精读」点句子右侧的 ☆，再回来导出。";
      return;
    }
    var md = starredMarkdown();
    preview.textContent = md;
    try {
      var range = document.createRange();
      range.selectNodeContents(preview);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    } catch (e) {}
    try {
      var blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = (meta.title || stem) + "-收藏句.md";
      document.body.appendChild(link);
      link.click();
      setTimeout(function(){ URL.revokeObjectURL(link.href); link.remove(); }, 1500);
    } catch (e) {}
  });
  var clearBtn = document.getElementById("star-clear");
  if (clearBtn) clearBtn.addEventListener("click", function(){
    var count = starredItems().length;
    if (!count) return;
    if (!window.confirm("确定清空全部 " + count + " 句收藏？此操作不可撤销。")) return;
    state.starred = {};
    persist();
    var preview = document.getElementById("star-preview");
    if (preview) { preview.hidden = true; preview.textContent = ""; }
    syncStarUI();
  });

  /* ---------- sentences ---------- */
  var sentWrap = document.getElementById("sentences");
  var sentCount = document.getElementById("sent-count");
  function renderSentences(){
    var filter = document.getElementById("sent-filter").value;
    sentWrap.textContent = "";
    var shown = 0;
    items.forEach(function(it){
      var hasVocab = vindex.some(function(e){ return e.re.test(it.en || ""); });
      if (filter === "star" && !state.starred[it.n]) return;
      if (filter === "vocab" && !hasVocab) return;
      shown++;
      var box = el("div", "sent");
      box.id = "s" + it.n;
      var r1 = el("div", "row1");
      r1.appendChild(el("div", "no", String(it.n)));
      var body = el("div", "body");
      var en = el("div", "en");
      en.appendChild(highlight(it.en || "", true));
      body.appendChild(en);
      var zh = el("div", "zh" + (state.zh ? "" : " hide"), it.zh || "");
      body.appendChild(zh);
      r1.appendChild(body);
      var acts = el("div", "acts");
      acts.appendChild(speakBtn(it.en));
      var star = el("button", "icon" + (state.starred[it.n] ? " on" : ""), state.starred[it.n] ? "★" : "☆");
      star.title = state.starred[it.n] ? "取消收藏" : "收藏这句，之后可在「收藏句」里集中复习";
      star.addEventListener("click", function(){ toggleStar(it.n, star); });
      acts.appendChild(star);
      r1.appendChild(acts);
      r1.appendChild(el("div", "pg", "p" + (it.page || "")));
      box.appendChild(r1);
      sentWrap.appendChild(box);
    });
    sentCount.textContent = shown + " / " + items.length + " 句";
    if (!shown) {
      sentWrap.appendChild(el("p", "empty", filter === "star"
        ? "还没有收藏任何句子：点句中右侧的 ☆ 或工具栏的「★ 收藏句」开始标记重点句。"
        : "没有符合筛选条件的句子。"));
    }
  }
  var zhBtn = document.getElementById("toggle-zh");
  function syncZh(){
    zhBtn.textContent = "中文翻译：" + (state.zh ? "显示" : "隐藏");
    zhBtn.classList.toggle("on", state.zh);
    Array.prototype.forEach.call(document.querySelectorAll("#sentences .zh"), function(z){
      z.classList.toggle("hide", !state.zh);
    });
  }
  zhBtn.addEventListener("click", function(){ state.zh = !state.zh; syncZh(); persist(); });
  var rateSel = document.getElementById("rate");
  rateSel.value = String(state.rate);
  rateSel.addEventListener("change", function(){ state.rate = parseFloat(rateSel.value); persist(); });
  document.getElementById("sent-filter").addEventListener("change", function(){
    renderSentences();
    starToggleSync();
  });
  var starToggle = document.getElementById("star-toggle");
  if (starToggle) starToggle.addEventListener("click", function(){
    var sel = document.getElementById("sent-filter");
    sel.value = sel.value === "star" ? "all" : "star";
    renderSentences();
    starToggleSync();
  });

  /* ---------- vocab ---------- */
  var vwrap = document.getElementById("vocab");
  var vcount = document.getElementById("vocab-count");
  function renderVocab(){
    var filter = document.getElementById("vocab-filter").value;
    var q = document.getElementById("vocab-search").value.trim().toLowerCase();
    vwrap.textContent = "";
    var done = 0, shown = 0;
    vocab.forEach(function(v){
      var isDone = !!state.mastered[v.term];
      if (isDone) done++;
      if (filter === "todo" && isDone) return;
      if (filter === "done" && !isDone) return;
      if (q && (String(v.term).toLowerCase().indexOf(q) < 0 &&
                String(v.zh || "").indexOf(q) < 0)) return;
      shown++;
      var card = el("div", "vcard" + (isDone ? " mastered" : ""));
      var tools = el("div", "tools");
      tools.appendChild(speakBtn(v.term));
      var mk = el("button", "icon" + (isDone ? " on" : ""), isDone ? "✓" : "○");
      mk.title = "标记为已掌握";
      mk.addEventListener("click", function(){
        if (state.mastered[v.term]) delete state.mastered[v.term];
        else state.mastered[v.term] = 1;
        persist(); renderVocab();
      });
      tools.appendChild(mk);
      card.appendChild(tools);
      var term = el("div", "term");
      term.appendChild(document.createTextNode(v.term || ""));
      if (v.level) term.appendChild(el("span", levelClass(v.level), v.level));
      card.appendChild(term);
      if (v.ipa) card.appendChild(el("div", "ipa", v.ipa));
      var line = el("div", "zh");
      line.appendChild(el("span", "pos", v.pos ? v.pos + " " : ""));
      line.appendChild(document.createTextNode(v.zh || ""));
      card.appendChild(line);
      if (v.note) card.appendChild(el("div", "note", v.note));
      if (v.examples && v.examples.length) {
        var ex = el("div", "ex");
        v.examples.slice(0, 1).forEach(function(e){
          ex.appendChild(el("div", "e", e.en || ""));
          if (e.zh) ex.appendChild(el("div", "z", e.zh));
          if (e.ref) ex.appendChild(refLink(e.ref));
        });
        card.appendChild(ex);
      }
      vwrap.appendChild(card);
    });
    var pct = vocab.length ? Math.round(done / vocab.length * 100) : 0;
    vcount.textContent = "已掌握 " + done + " / " + vocab.length + "（" + pct + "%）" +
                         (shown !== vocab.length ? "，显示 " + shown : "");
    if (!shown) vwrap.appendChild(el("p", "empty", "没有符合条件的生词。"));
  }
  document.getElementById("vocab-filter").addEventListener("change", renderVocab);
  document.getElementById("vocab-search").addEventListener("input", renderVocab);

  /* ---------- phrases ---------- */
  var pw = document.getElementById("phrases");
  if (phrases.length) {
    var table = el("table");
    var thead = el("thead");
    var hr = el("tr");
    ["搭配 / 短语", "释义", "用法提示", "出处"].forEach(function(h){ hr.appendChild(el("th", null, h)); });
    thead.appendChild(hr); table.appendChild(thead);
    var tb = el("tbody");
    phrases.forEach(function(p){
      var tr = el("tr");
      var c1 = el("td");
      c1.appendChild(el("div", "ph", p.term || ""));
      if (p.pos) c1.appendChild(el("div", "small muted", p.pos));
      tr.appendChild(c1);
      tr.appendChild(el("td", null, p.zh || ""));
      tr.appendChild(el("td", "small muted", p.note || ""));
      var c4 = el("td", "small");
      if (p.example && p.example.en) c4.appendChild(el("div", "e", p.example.en));
      if (p.example && p.example.zh) c4.appendChild(el("div", "muted", p.example.zh));
      if (p.ref) c4.appendChild(refLink(p.ref));
      tr.appendChild(c4);
      tb.appendChild(tr);
    });
    table.appendChild(tb); pw.appendChild(table);
  } else { pw.appendChild(el("p", "empty", "没有短语数据。")); }

  /* ---------- grammar ---------- */
  var gw = document.getElementById("grammar");
  if (grammar.length) {
    grammar.forEach(function(g, i){
      var d = el("details", "g");
      if (i === 0) d.open = true;
      var s = el("summary");
      s.appendChild(document.createTextNode(g.title || ("语法点 " + (i + 1))));
      d.appendChild(s);
      var inner = el("div", "inner");
      if (g.structure) inner.appendChild(el("div", "struct", g.structure));
      if (g.explain) inner.appendChild(el("p", null, g.explain));
      (g.examples || []).forEach(function(e){
        var box = el("div", "sent");
        var en = el("div", "en"); en.appendChild(highlight(e.en || ""));
        box.appendChild(en);
        if (e.zh) box.appendChild(el("div", "zh", e.zh));
        var meta2 = el("div", "small");
        if (e.ref) meta2.appendChild(refLink(e.ref));
        if (e.note) meta2.appendChild(el("span", "muted", "  " + e.note));
        box.appendChild(meta2);
        inner.appendChild(box);
      });
      if (g.caution) inner.appendChild(el("div", "caution", "注意：" + g.caution));
      d.appendChild(inner);
      gw.appendChild(d);
    });
  } else { gw.appendChild(el("p", "empty", "没有语法数据。")); }

  /* ---------- patterns ---------- */
  var patw = document.getElementById("patterns");
  if (patterns.length) {
    patterns.forEach(function(p){
      var c = el("div", "card");
      var en = el("div", "en");
      en.style.fontSize = "17px";
      en.appendChild(highlight(p.en || ""));
      c.appendChild(en);
      if (p.zh) c.appendChild(el("div", "zh", p.zh));
      if (p.usage) c.appendChild(el("div", "small muted", "用法：" + p.usage));
      if (p.rewrite) c.appendChild(el("div", "small", "换个说法：" + p.rewrite));
      var m = el("div", "small");
      if (p.ref) m.appendChild(refLink(p.ref));
      c.appendChild(m);
      patw.appendChild(c);
    });
  } else { patw.appendChild(el("p", "empty", "没有句型数据。")); }

  /* ---------- exercises ---------- */
  var ew = document.getElementById("exercises");
  function norm(s){
    return String(s == null ? "" : s).toLowerCase().replace(/[\s,.!?;:'"’“”]/g, "");
  }
  function accepted(ex){
    if (Array.isArray(ex.answer)) return ex.answer;
    return [ex.answer];
  }
  function trial(ex){
    var ok = false;
    accepted(ex).forEach(function(a){ if (norm(a) && norm(a) === norm(ex.__input || "")) ok = true; });
    return ok;
  }
  if (exercises.length) {
    exercises.forEach(function(ex, i){
      var box = el("div", "ex");
      var q = el("div", "q");
      q.appendChild(el("span", "idx", "#" + (i + 1)));
      q.appendChild(document.createTextNode(ex.question || ""));
      box.appendChild(q);
      var fb = el("div", "fb");
      function feedback(ok, text){
        fb.className = "fb show " + (ok ? "ok" : "no");
        fb.textContent = text || "";
      }
      function showAnswer(){
        fb.className = "fb show";
        fb.textContent = "参考答案：" + accepted(ex).join(" / ") + (ex.explain ? "　—　" + ex.explain : "");
      }
      if (ex.type === "choice") {
        var opts = el("div", "opts");
        var buttons = [];
        (ex.options || []).forEach(function(opt, oi){
          var b = el("button", "opt", String.fromCharCode(65 + oi) + ". " + opt);
          b.addEventListener("click", function(){
            buttons.forEach(function(x){ x.classList.remove("right", "wrong"); });
            var correct = String(ex.answer).toUpperCase().charCodeAt(0) - 65;
            if (isNaN(correct)) correct = Number(ex.answer);
            if (oi === correct) { b.classList.add("right"); feedback(true, "✓ 正确。" + (ex.explain || "")); }
            else {
              b.classList.add("wrong");
              if (buttons[correct]) buttons[correct].classList.add("right");
              feedback(false, "✗ 再想想，正确答案已标出。" + (ex.explain || ""));
            }
          });
          buttons.push(b); opts.appendChild(b);
        });
        box.appendChild(opts);
      } else if (ex.type === "translate") {
        var ta = el("textarea");
        ta.placeholder = "写出你的翻译（可留空，直接看参考答案）";
        box.appendChild(ta);
        var row = el("div"); row.style.marginTop = "8px";
        var chk = el("button", "btn primary", "对照参考答案");
        chk.addEventListener("click", showAnswer);
        row.appendChild(chk); box.appendChild(row);
      } else {
        var inp = el("input");
        inp.type = "text";
        inp.className = "text";
        inp.placeholder = "填入答案";
        inp.style.minWidth = "240px";
        box.appendChild(inp);
        var row2 = el("div"); row2.style.marginTop = "8px";
        var chk2 = el("button", "btn primary", "检查");
        chk2.addEventListener("click", function(){
          ex.__input = inp.value;
          var ok = trial(ex);
          inp.style.borderColor = ok ? "var(--ok)" : "var(--bad)";
          if (ok) feedback(true, "✓ 正确。" + (ex.explain || ""));
          else { feedback(false, "✗ 再试一次（点「显示全部答案」看参考答案）。"); }
        });
        row2.appendChild(chk2); box.appendChild(row2);
      }
      box.appendChild(fb);
      var ans = el("div", "ans");
      ans.textContent = "参考答案：" + accepted(ex).join(" / ") + (ex.explain ? "　—　" + ex.explain : "");
      box.appendChild(ans);
      box._show = function(){ ans.classList.add("show"); };
      box._reset = function(){
        ans.classList.remove("show"); fb.className = "fb"; fb.textContent = "";
        var t = box.querySelector("textarea"); if (t) t.value = "";
        var n = box.querySelector("input[type=text]"); if (n) { n.value = ""; n.style.borderColor = ""; }
        Array.prototype.forEach.call(box.querySelectorAll(".opt"), function(o){ o.classList.remove("right", "wrong"); });
      };
      ew.appendChild(box);
    });
    document.getElementById("ex-count").textContent = exercises.length + " 题";
    document.getElementById("show-all").addEventListener("click", function(){
      Array.prototype.forEach.call(ew.children, function(box){ if (box._show) box._show(); });
    });
    document.getElementById("reset-ex").addEventListener("click", function(){
      Array.prototype.forEach.call(ew.children, function(box){ if (box._reset) box._reset(); });
    });
  } else {
    ew.appendChild(el("p", "empty", "没有练习题数据。"));
    document.querySelector('.toolbar #show-all').disabled = true;
  }

  /* ---------- tabs ---------- */
  var tabDefs = [
    ["overview", "概览", null],
    ["sentences", "逐句精读", items.length],
    ["starred", "收藏句", "dynamic"],
    ["vocab", "生词", vocab.length],
    ["phrases", "短语搭配", phrases.length],
    ["grammar", "语法点", grammar.length],
    ["patterns", "句型模板", patterns.length],
    ["exercises", "练习", exercises.length]
  ].filter(function(t){ return t[2] === null || t[2] === "dynamic" || t[2] > 0; });
  var tabs = document.getElementById("tabs");
  function showTab(name, doScroll){
    Array.prototype.forEach.call(tabs.children, function(x){
      x.setAttribute("aria-selected", String(x.getAttribute("data-tab") === name));
    });
    Array.prototype.forEach.call(document.querySelectorAll("main > section"), function(s){
      s.hidden = s.id !== "tab-" + name;
    });
    // the starred list is state-derived: refresh it whenever it becomes visible
    if (name === "starred") renderStarred();
    if (doScroll !== false) window.scrollTo({ top: 0, behavior: "smooth" });
  }
  tabDefs.forEach(function(t){
    var b = el("button", null, t[1]);
    b.setAttribute("role", "tab");
    b.setAttribute("data-tab", t[0]);
    b.setAttribute("aria-selected", "false");
    if (t[2] === "dynamic") {
      var dynamicBadge = el("span", "count", "0");
      dynamicBadge.id = "badge-starred";
      b.appendChild(dynamicBadge);
    } else if (t[2] !== null) {
      b.appendChild(el("span", "count", String(t[2])));
    }
    b.addEventListener("click", function(){
      showTab(t[0]);
      if (location.hash !== "#" + t[0]) history.replaceState(null, "", "#" + t[0]);
    });
    tabs.appendChild(b);
  });
  /* deep links: #sentences / #vocab … select a tab, #s123 jumps to a sentence */
  var hash = (location.hash || "").replace(/^#/, "");
  var jump = /^s(\d+)$/.exec(hash);
  if (jump) {
    showTab("sentences", false);
    var target = document.getElementById(hash);
    if (target) target.scrollIntoView();
  } else if (tabDefs.some(function(t){ return t[0] === hash; })) {
    showTab(hash, false);
  } else {
    showTab(tabDefs[0] ? tabDefs[0][0] : "overview", false);
  }
  window.addEventListener("hashchange", function(){
    var next = (location.hash || "").replace(/^#/, "");
    var hit = /^s(\d+)$/.exec(next);
    if (hit) { showTab("sentences", false); var t = document.getElementById(next); if (t) t.scrollIntoView(); }
    else if (tabDefs.some(function(t){ return t[0] === next; })) showTab(next, false);
  });

  /* ---------- footer ---------- */
  document.getElementById("footer").textContent =
    "由 english-study-from-pdf skill 生成 · 源文件：" +
    ((transcript.source && transcript.source.name) || "") +
    (stats.extractedAt ? " · 提取时间 " + stats.extractedAt : "");

  renderSentences();
  syncZh();
  renderVocab();
  renderStarred();
  syncStarUI();
})();
</script>
</body>
</html>
