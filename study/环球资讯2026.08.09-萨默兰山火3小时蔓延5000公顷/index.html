<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>环球新闻 2026.08.09 · 萨默兰山火与本周要闻 · 英语学习</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --fg:#191b1f; --muted:#6b7280; --line:#e4e7ec;
    --accent:#4d6bfe; --accent-soft:#eef1ff; --ok:#15803d; --ok-soft:#e8f7ee;
    --warn:#b45309; --warn-soft:#fef3e2; --bad:#b91c1c; --bad-soft:#fdecec;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
           "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#15171c; --card:#1d2027; --fg:#e8eaed; --muted:#9aa3af; --line:#2c313b;
      --accent:#8ba2ff; --accent-soft:#242a3f; --ok:#6ee7a0; --ok-soft:#1b2f24;
      --warn:#f5c173; --warn-soft:#332717; --bad:#f8a3a3; --bad-soft:#3a1f1f;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
       font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;
       background:var(--accent-soft);border-radius:6px;padding:.1em .35em}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}

  header.top{padding:28px 0 16px;border-bottom:1px solid var(--line);margin-bottom:22px}
  h1{margin:0 0 6px;font-size:26px;line-height:1.3}
  .sub{color:var(--muted);font-size:14px}
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .badge{background:var(--card);border:1px solid var(--line);border-radius:999px;
         padding:3px 11px;font-size:12.5px;color:var(--muted)}
  .badge strong{color:var(--fg);font-weight:600}
  .badge.lv{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}

  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
           background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
           padding:10px 0;margin-bottom:14px;border-bottom:1px solid var(--line)}
  nav.tabs button{appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);
       font:inherit;font-size:14.5px;padding:6px 13px;border-radius:999px;cursor:pointer}
  nav.tabs button:hover{background:var(--card);color:var(--fg)}
  nav.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;font-weight:600}
  nav.tabs .count{opacity:.7;font-size:12px;margin-left:5px}

  section[hidden]{display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  h2{font-size:19px;margin:26px 0 12px}
  h2:first-child{margin-top:4px}
  h3{font-size:16.5px;margin:0 0 8px}
  .muted{color:var(--muted)}
  .small{font-size:13.5px}
  .grid{display:grid;gap:12px}
  .grid.stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .stat b{display:block;font-size:22px;line-height:1.2}
  .stat span{color:var(--muted);font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;
        padding:2px 10px;font-size:13px}
  ol.plan{margin:6px 0 0;padding-left:22px}
  ol.plan li{margin:5px 0}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
           background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
           padding:10px 14px;margin-bottom:14px;position:sticky;top:52px;z-index:15}
  .toolbar label{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  select,input[type=search],input[type=text],textarea{
      font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);
      border-radius:8px;padding:5px 9px}
  textarea{width:100%;min-height:64px;resize:vertical}
  .btn{appearance:none;font:inherit;font-size:13.5px;cursor:pointer;background:var(--card);
       color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 11px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{opacity:.9;color:#fff}
  .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  /* sentences */
  .sent{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:12px 16px;margin-bottom:10px;scroll-margin-top:120px}
  .sent:target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .sent .row1{display:flex;gap:12px;align-items:baseline}
  .sent .no{flex:0 0 38px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;
            padding-top:4px;text-align:right}
  .sent .body{flex:1;min-width:0}
  .en{font-family:var(--serif);font-size:17.5px;line-height:1.6}
  .zh{color:var(--muted);font-size:14.5px;margin-top:4px}
  .zh.hide{display:none}
  .sent .acts{flex:0 0 auto;display:flex;gap:4px;opacity:.35;transition:opacity .15s}
  .sent:hover .acts,.sent .acts:focus-within{opacity:1}
  .icon{appearance:none;background:transparent;border:none;cursor:pointer;font-size:15px;
        padding:4px 5px;border-radius:6px;color:var(--muted);line-height:1}
  .icon:hover{background:var(--accent-soft);color:var(--accent)}
  .icon.on{color:var(--warn)}
  .pg{color:var(--muted);font-size:11.5px;flex:0 0 34px;text-align:right;padding-top:6px}
  mark.v{background:transparent;color:inherit;border-bottom:2px solid var(--accent);cursor:help;font-weight:600}
  mark.v.tagged{background:var(--accent-soft);border-radius:4px;padding:0 2px}

  /* starred sentences */
  .md-preview{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      padding:14px 16px;margin:12px 0 0;white-space:pre-wrap;word-break:break-word;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;
      max-height:440px;overflow:auto}
  .md-preview::before{content:"Markdown 预览（可直接全选复制）";display:block;margin-bottom:8px;
      color:var(--muted);font-family:var(--sans);font-size:12.5px}

  /* vocab */
  .vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
         padding:14px 16px;position:relative;min-height:150px}
  .vcard.mastered{opacity:.55}
  .vcard .term{font-family:var(--serif);font-size:20px;font-weight:600;display:flex;
               align-items:center;gap:8px;flex-wrap:wrap}
  .vcard .pos{font-size:12.5px;color:var(--muted);font-style:italic}
  .vcard .ipa{color:var(--muted);font-size:13.5px;margin:2px 0 8px}
  .vcard .zh{color:var(--fg);font-size:15px;margin-bottom:6px}
  .vcard .note{font-size:13px;color:var(--muted)}
  .vcard .ex{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:13.5px}
  .vcard .ex .e{font-family:var(--serif)}
  .vcard .ex .z{color:var(--muted)}
  .vcard .tools{position:absolute;top:10px;right:10px;display:flex;gap:4px}
  .lvl{font-size:11.5px;border-radius:5px;padding:1px 6px;background:var(--accent-soft);color:var(--accent)}
  .lvl.hi{background:var(--warn-soft);color:var(--warn)}
  .lvl.core{background:var(--ok-soft);color:var(--ok)}
  .ref{font-size:12.5px;color:var(--muted)}
  .ref a{color:var(--muted);text-decoration:underline dotted}
  .progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 0}
  .progress i{display:block;height:100%;background:var(--ok)}

  /* lists */
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
  .ph{font-family:var(--serif);font-size:16.5px;font-weight:600}

  /* grammar */
  details.g{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
            margin-bottom:10px;overflow:hidden}
  details.g>summary{cursor:pointer;padding:13px 18px;font-weight:600;font-size:16px;list-style:none;
        display:flex;gap:10px;align-items:center}
  details.g>summary::-webkit-details-marker{display:none}
  details.g>summary::before{content:"▸";color:var(--accent);transition:transform .15s}
  details.g[open]>summary::before{transform:rotate(90deg)}
  details.g .inner{padding:0 18px 16px;border-top:1px solid var(--line)}
  .struct{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
          padding:10px 14px;margin:12px 0;font-family:var(--serif);font-size:16px}
  .caution{background:var(--warn-soft);border-radius:8px;padding:9px 13px;font-size:13.5px;
           color:var(--warn);margin-top:10px}

  /* exercises */
  .ex{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      padding:14px 18px;margin-bottom:12px}
  .ex .q{font-family:var(--serif);font-size:16.5px;margin-bottom:10px}
  .ex .q .idx{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-right:6px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:9px;
       padding:8px 12px;font:inherit;font-size:15px;cursor:pointer;color:var(--fg)}
  .opt:hover{border-color:var(--accent)}
  .opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .fb{margin-top:9px;font-size:14px;display:none}
  .fb.show{display:block}
  .fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
  .ans{display:none;margin-top:9px;background:var(--ok-soft);border-radius:8px;padding:9px 13px;font-size:14px}
  .ans.show{display:block}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:36px;
         border-top:1px solid var(--line);padding-top:16px}
  .empty{color:var(--muted);font-size:14px;padding:10px 2px}
  @media print{
    nav.tabs,.toolbar,.acts,.tools{display:none!important}
    body{background:#fff}
    .zh.hide{display:block!important}
    section[hidden]{display:block!important}
    .sent,.card,.vcard{break-inside:avoid;box-shadow:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">英语学习页</h1>
    <div class="sub" id="subtitle"></div>
    <div class="badges" id="badges"></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main>
    <section id="tab-overview" role="tabpanel">
      <div class="card" id="summary-card"></div>
      <div class="grid stats" id="stat-grid"></div>
      <div class="card" id="plan-card"></div>
    </section>

    <section id="tab-sentences" role="tabpanel" hidden>
      <div class="toolbar">
        <button class="btn on" id="toggle-zh">中文翻译：显示</button>
        <label>语速
          <select id="rate">
            <option value="0.7">0.7×</option>
            <option value="0.85" selected>0.85×</option>
            <option value="1">1.0×</option>
          </select>
        </label>
        <button class="btn" id="star-toggle" title="只看我收藏的重点句">★ 收藏句 <span id="star-count">0</span></button>
        <label>范围
          <select id="sent-filter">
            <option value="all">全部句子</option>
            <option value="star">只看收藏</option>
            <option value="vocab">只看含生词的句子</option>
          </select>
        </label>
        <span class="small muted" id="sent-count"></span>
      </div>
      <div id="sentences"></div>
    </section>

    <section id="tab-starred" role="tabpanel" hidden>
      <div class="toolbar">
        <span class="small muted" id="starred-count"></span>
        <button class="btn primary" id="star-export">导出 Markdown</button>
        <button class="btn" id="star-clear">清空收藏</button>
      </div>
      <div id="starred"></div>
      <pre class="md-preview" id="star-preview" hidden></pre>
    </section>

    <section id="tab-vocab" role="tabpanel" hidden>
      <div class="toolbar">
        <label>显示
          <select id="vocab-filter">
            <option value="all">全部</option>
            <option value="todo">未掌握</option>
            <option value="done">已掌握</option>
          </select>
        </label>
        <input type="search" id="vocab-search" placeholder="筛选单词…">
        <span class="small muted" id="vocab-count"></span>
      </div>
      <div class="vgrid" id="vocab"></div>
    </section>

    <section id="tab-phrases" role="tabpanel" hidden><div id="phrases"></div></section>
    <section id="tab-grammar" role="tabpanel" hidden><div id="grammar"></div></section>
    <section id="tab-patterns" role="tabpanel" hidden><div id="patterns"></div></section>
    <section id="tab-exercises" role="tabpanel" hidden>
      <div class="toolbar">
        <button class="btn" id="show-all">显示全部答案</button>
        <button class="btn" id="reset-ex">重做</button>
        <span class="small muted" id="ex-count"></span>
      </div>
      <div id="exercises"></div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

<script id="study-data" type="application/json">{"meta":{"title":"环球新闻 2026.08.09 · 萨默兰山火与本周要闻","subtitle":"Global National 新闻播报 · 中英对照逐句台词本（413 句 / 3304 词）","level":"B1–B2","summary":"本期《环球新闻》以卑诗省萨默兰（Summerland）山火为主线索：周五傍晚起火，三小时内蔓延 5,000 公顷，两万余人连夜撤离，省级紧急状态启动，记者本人也在直播中撤离。随后是本周其他要闻：美国参议院以 50:49 确认托德·布兰奇出任司法部长；意大利与西班牙因休达移民潮互相实施边境管控；欧洲破纪录热浪让多瑙河、莱茵河水位下降，二战沉船与\"饥饿石\"重见天日；亚洲多地遭遇 40℃ 以上高温；新斯科舍省最高法院裁定住帐篷者应享有更高社会援助；最后是一则暖心报道——一种新发现的海马以卑诗省教授阿曼达·文森特命名。","topics":["突发新闻与现场报道","极端天气与气候","美国政治","欧洲边境政策","无家可归者权益","海洋保护"],"learningFocus":["新闻播报高频动词：evacuate / flee / ignite / consume / soar / recede / overturn","灾害与天气词汇场：wildfire, drought, humidity, visibility, heat wave, reservoir","分词结构：现在分词作结果状语、过去分词作后置定语、独立主格（新闻画面解说必备）","被动语态与转述结构：is named / was ordered to / are being blamed for / officials say (that)…","书面表达句型：What started as A exploded to B / dozens, if not more, … / It is + adj + to do"],"studyPlan":["第 1 步（15 分钟）：通读「逐句精读」第 1–60 句，先不开中文，用语境猜词义，再点开中文核对。","第 2 步（20 分钟）：过一遍「生词」卡片，把不认识的标记出来（不要标记已掌握的），朗读每个词的例句。","第 3 步（15 分钟）：读「语法点」，重点掌握分词结构与被动语态——新闻英语的两大骨架。","第 4 步（15 分钟）：用「句型模板」做口头改写练习，每句至少说两个自己的句子（可用当天新闻替换主语）。","第 5 步（15 分钟）：做「练习」并按参考答案自评；翻译题先写再对照，不要直接看答案。","第 6 步（10 分钟）：回到「逐句精读」，用 0.85× 速度跟读第 1–40 句，模仿播报语调与停顿。"],"estimatedMinutes":90},"vocab":[{"term":"evacuate","ipa":"/ɪˈvækjueɪt/","pos":"v.","zh":"撤离，疏散（人离开危险地区）","level":"B2","note":"及物、不及物均可：evacuate the town / residents were ordered to evacuate。名词 evacuation（撤离行动）。","examples":[{"en":"More than 20,000 residents in B.C.'s interior, including our global news team, forced to evacuate.","zh":"卑诗省内陆两万多居民，包括我们环球新闻的团队，被迫撤离。","ref":2},{"en":"The entire community of Summerland was ordered to evacuate around 12.30 Friday night.","zh":"周五晚上 12 点 30 分左右，萨默兰整个社区被命令撤离。","ref":85}]},{"term":"explosive","ipa":"/ɪkˈspləʊsɪv/","pos":"adj.","zh":"爆炸性的；（局势、增长）急剧的、极具爆发力的","level":"B2","note":"新闻中常形容火势、增长、局势：explosive wildfire / explosive growth。动词 explode（爆炸；激增），名词 explosion。","examples":[{"en":"On this Saturday night, fleeing an explosive wildfire.","zh":"在这个周六夜晚，人们逃离一场爆炸性野火。","ref":1},{"en":"B.C.'s wildfire service warned the conditions are explosive.","zh":"卑诗省山火服务处警告称，情况极具爆炸性。","ref":22}]},{"term":"ferocity","ipa":"/fəˈrɒsəti/","pos":"n.","zh":"凶猛，猛烈，激烈程度","level":"C1","note":"常与 with 连用表示方式：with frightening speed and ferocity。形容词 ferocious（凶猛的）。","examples":[{"en":"It exploded with frightening speed and ferocity Friday evening.","zh":"周五晚上，火势以惊人的速度和凶猛程度爆发。","ref":28}]},{"term":"flee","ipa":"/fliː/","pos":"v.","zh":"逃离，逃走","level":"B1","note":"不规则变化：flee – fled – fled。既可直接带宾语（flee the flames），也可接 from（flee from danger）。flee for one's life 意为\"逃命\"。","examples":[{"en":"as 20,000 people in B.C.'s Okanagan region fled for their lives last night.","zh":"昨晚卑诗省欧肯那根地区两万人逃生的情景。","ref":16},{"en":"As thousands of British Columbians fled the fast-moving flames,","zh":"成千上万的卑诗省民逃离迅速蔓延的火焰，","ref":30}]},{"term":"wildfire","ipa":"/ˈwaɪldfaɪə(r)/","pos":"n.","zh":"野火，山火","level":"B1","note":"wildfire service 指山火（扑救）服务处；wildfire fight 指山火扑救。","examples":[{"en":"New details on the wildfire fight and the forecast.","zh":"关于山火扑救和天气预报的最新细节。","ref":6}]},{"term":"municipality","ipa":"/mjuːˌnɪsɪˈpæləti/","pos":"n.","zh":"市镇，自治市（有地方政府的行政区）","level":"C1","note":"形容词 municipal（市政的）：municipal government。新闻里常与 entire 连用强调整镇撤离。","examples":[{"en":"covering the entire municipality of Summerland, B.C.","zh":"覆盖卑诗省夏季兰整个市镇。","ref":25}]},{"term":"ignite","ipa":"/ɪɡˈnaɪt/","pos":"v.","zh":"点燃，起火，引发","level":"B2","note":"本义\"点燃\"，引申为\"引发（情绪、争议）\"。名词 ignition（点火装置；着火）。","examples":[{"en":"In just three hours after it first ignited, it's since grown much larger.","zh":"在首次燃起后的短短三小时内，火势已扩大了很多。","ref":50}]},{"term":"hectare","ipa":"/ˈhekteə(r)/","pos":"n.","zh":"公顷（= 10,000 平方米）","level":"B1","note":"报灾常用单位：5,000 hectares ≈ 50 square kilometers。注意 5.30 / 12,000 这类数字的读法：five thirty、twelve thousand。","examples":[{"en":"burning so aggressively, it consumed some 50 square kilometers, or 5,000 hectares, of land.","zh":"燃烧得极为猛烈，吞噬了约 50 平方公里，即 5000 公顷的土地。","ref":49}]},{"term":"consume","ipa":"/kənˈsjuːm/","pos":"v.","zh":"吞噬，烧毁；消耗；充斥（be consumed with/by）","level":"B2","note":"同一词在文中两种用法：火\"吞噬\"土地；be consumed with smoke 意为\"被浓烟吞没\"。名词 consumption。","examples":[{"en":"burning so aggressively, it consumed some 50 square kilometers","zh":"燃烧得极为猛烈，吞噬了约 50 平方公里","ref":49},{"en":"And the entire hillside was consumed with smoke and large flames.","zh":"整个山坡都被浓烟和巨大的火焰吞没。","ref":78}]},{"term":"belongings","ipa":"/bɪˈlɒŋɪŋz/","pos":"n. (pl.)","zh":"财物，随身物品","level":"B1","note":"恒用复数。leave one's belongings behind 丢下财物。注意与 belonging（归属感）区分。","examples":[{"en":"Many evacuees leaving nearly all of their belongings","zh":"许多撤离者几乎将所有财物","ref":53}]},{"term":"livelihood","ipa":"/ˈlaɪvlihʊd/","pos":"n.","zh":"生计，谋生手段","level":"B2","note":"可数名词：lose/earn a livelihood。灾害报道中与 belongings 并列，强调损失不只是财物。","examples":[{"en":"and their livelihoods behind the fire line.","zh":"和生计都留在了火线之后。","ref":54}]},{"term":"ranch","ipa":"/rɑːntʃ/","pos":"n.","zh":"大牧场，农场","level":"B1","note":"ranch land 牧场用地；rancher 牧场主。与美国西部的牧场文化相关，文中指卑诗省内陆农牧区。","examples":[{"en":"This here is just ranches, full of ranches and tons of animals, horses, everything.","zh":"这里全是牧场，遍地是牧场和成群的动物、马匹，什么都有。","ref":57}]},{"term":"urge","ipa":"/ɜːdʒ/","pos":"v.","zh":"敦促，力劝；（n.）强烈愿望","level":"B2","note":"urge sb to do sth。名词常用复数 urges。新闻中官方表态高频词。","examples":[{"en":"Premier David Eby urging all British Columbians under evacuation order","zh":"省长大卫·埃比敦促所有收到疏散令的卑诗省民","ref":59}]},{"term":"displaced","ipa":"/dɪsˈpleɪst/","pos":"adj.","zh":"流离失所的，被迫离开家园的","level":"B2","note":"be displaced by/of。名词 displacement。灾害与人道报道固定搭配：displaced people / families。","examples":[{"en":"many people have been displaced.","zh":"许多人流离失所。","ref":63}]},{"term":"certainty","ipa":"/ˈsɜːtnti/","pos":"n.","zh":"确定的事，必然；确定性","level":"B2","note":"a certainty 指\"必然发生的事\"：With the loss of homes, a certainty. 形容词 certain，副词 certainly。","examples":[{"en":"With the loss of homes, a certainty","zh":"随着家园被毁，这是一场确定的灾难","ref":65}]},{"term":"reprieve","ipa":"/rɪˈpriːv/","pos":"n.","zh":"（痛苦、坏天气等的）缓解，暂时解脱","level":"C1","note":"天气报道常用：no reprieve in the forecast（预报中没有任何缓解迹象）。也作动词\"暂缓处决、缓期\"。","examples":[{"en":"Unfortunately, there's no reprieve in the forecast.","zh":"不幸的是，天气预报中没有任何缓解的迹象。","ref":112}]},{"term":"humidity","ipa":"/hjuːˈmɪdəti/","pos":"n.","zh":"湿度","level":"B1","note":"relative humidity 相对湿度；形容词 humid（潮湿的）。与山火风险直接相关：湿度低则火险高。","examples":[{"en":"afternoon and early evening is when we see the lowest relative humidity,","zh":"下午和傍晚时分，我们会看到最低的相对湿度，","ref":115}]},{"term":"visibility","ipa":"/ˌvɪzəˈbɪləti/","pos":"n.","zh":"能见度","level":"B1","note":"poor/reduced visibility 能见度差。形容词 visible（可见的）。气象与交通报道固定用词。","examples":[{"en":"We've got poor air quality and reduced visibility.","zh":"空气质量差，能见度降低。","ref":126}]},{"term":"soar","ipa":"/sɔː(r)/","pos":"v.","zh":"飙升，猛增；高飞","level":"B2","note":"主语多为 prices / temperatures / costs。对比同篇的 drop（下降）、pick up（风力增强）。","examples":[{"en":"We're also seeing those temperatures soaring Sunday, Monday, and into early next week.","zh":"我们也看到周日、周一及下周初气温将飙升。","ref":132}]},{"term":"respiratory","ipa":"/rəˈspɪrətri/","pos":"adj.","zh":"呼吸的，呼吸系统的","level":"C1","note":"respiratory issues/diseases 呼吸系统疾病。空气质量预警里的标准表达。","examples":[{"en":"So, those with respiratory issues","zh":"所以，有呼吸系统疾病的人","ref":137}]},{"term":"drought","ipa":"/draʊt/","pos":"n.","zh":"干旱，旱灾","level":"B1","note":"注意拼写与发音（gh 不发音）。动词 dry out。常与 prolonged（持续的）搭配。","examples":[{"en":"Prolonged drought conditions and low snowpack are contributing to a significant drop in water levels","zh":"持续的干旱条件和低积雪量导致……水位显著下降","ref":327},{"en":"telling of drought, crop failure, and hardship.","zh":"诉说着干旱、作物歉收和艰难困苦。","ref":317}]},{"term":"reservoir","ipa":"/ˈrezəvwɑː(r)/","pos":"n.","zh":"水库，蓄水池；储备","level":"B2","note":"词尾 -oir 来自法语，发音为 /wɑː(r)/。文中指美国最大水库（科罗拉多河流域的米德湖）。","examples":[{"en":"Why water levels in America's largest reservoir have fallen to record lows.","zh":"为什么美国最大水库的水位会降至历史最低点。","ref":263}]},{"term":"scorching","ipa":"/ˈskɔːtʃɪŋ/","pos":"adj.","zh":"酷热的，灼热的","level":"B2","note":"动词 scorch 指\"烤焦\"。同类形容高温的词在本篇还出现 blistering（酷热的），可一并记忆。","examples":[{"en":"The prolonged scorching conditions are being blamed","zh":"持续的酷热天气被认为是……的原因","ref":266}]},{"term":"blistering","ipa":"/ˈblɪstərɪŋ/","pos":"adj.","zh":"极热的，酷热的；（速度）极快的","level":"C1","note":"blister 是\"水泡\"，晒到起泡即\"酷热\"。blistering heat / blistering pace。","examples":[{"en":"despite efforts to shelter them from the blistering temperatures.","zh":"尽管园方努力为它们提供庇护以躲避酷热。","ref":272}]},{"term":"resurface","ipa":"/ˌriːˈsɜːfɪs/","pos":"v.","zh":"重新浮出水面；重新出现，再受关注","level":"B2","note":"re- 表\"再一次\"。文中既指沉船真的露出水面，也暗指\"历史重现\"。","examples":[{"en":"relics are resurfacing,","zh":"遗迹重新浮出水面，","ref":277},{"en":"has resurfaced in eastern Serbia,","zh":"在塞尔维亚东部重新浮出水面，","ref":284}]},{"term":"relic","ipa":"/ˈrelɪk/","pos":"n.","zh":"遗迹，遗物，古董","level":"C1","note":"wartime relics 战时遗物。历史与考古报道常用；也可指\"过时的东西\"。","examples":[{"en":"The receding waters are revealing other wartime relics,","zh":"退去的河水揭示了其他战时遗迹，","ref":302}]},{"term":"unprecedented","ipa":"/ʌnˈpresɪdentɪd/","pos":"adj.","zh":"史无前例的，前所未有的","level":"C1","note":"un- + precedent（先例）+ -ed。新闻评论中极高频；同义表达 never seen before（见第 23 句）。","examples":[{"en":"This is unprecedented.","zh":"这是史无前例的。","ref":301}]},{"term":"recede","ipa":"/rɪˈsiːd/","pos":"v.","zh":"（水）退去，消退；逐渐减弱","level":"C1","note":"receding waters 退去的河水。recede from memory 从记忆中淡去。反义 rise / advance。","examples":[{"en":"The receding waters are revealing other wartime relics,","zh":"退去的河水揭示了其他战时遗迹，","ref":302}]},{"term":"curator","ipa":"/kjʊˈreɪtə(r)/","pos":"n.","zh":"（博物馆）馆长，策展人","level":"B2","note":"动词 curate（策展；精心挑选），名词 curation。博物馆、展览类报道必备词。","examples":[{"en":"says this museum curator,","zh":"这位博物馆馆长说道，","ref":309}]},{"term":"tusk","ipa":"/tʌsk/","pos":"n.","zh":"（象、野猪等的）长牙，象牙","level":"B2","note":"常成对出现：tusks。象的长牙与 horn（角）不同，注意区分。","examples":[{"en":"Its lower jaw, tusks,","zh":"它的下颌骨、象牙，","ref":311}]},{"term":"eerie","ipa":"/ˈɪəri/","pos":"adj.","zh":"诡异而令人不安的，阴森的","level":"C1","note":"拼写特殊（ei 顺序），发音 /ˈɪəri/ 与 eye 同源。eerie silence / eerie discovery。","examples":[{"en":"Perhaps the most eerie discovery in the Danube,","zh":"也许在多瑙河最令人毛骨悚然的发现，","ref":314}]},{"term":"hardship","ipa":"/ˈhɑːdʃɪp/","pos":"n.","zh":"艰难困苦，苦难","level":"B2","note":"可数/不可数均可：financial hardship。与 hardship 并列的 crop failure（作物歉收）也值得记住。","examples":[{"en":"telling of drought, crop failure, and hardship.","zh":"诉说着干旱、作物歉收和艰难困苦。","ref":317}]},{"term":"nomination","ipa":"/ˌnɒmɪˈneɪʃn/","pos":"n.","zh":"提名；任命提名","level":"B2","note":"动词 nominate（提名），名词 nominee（被提名人）。美国政治报道核心词：confirm a nomination（确认提名）。","examples":[{"en":"The nomination is confirmed.","zh":"提名已确认。","ref":154},{"en":"the U.S. Senate confirmed Todd Blanche's nomination","zh":"美国参议院确认了托德·布兰奇的提名","ref":156}]},{"term":"attorney general","ipa":"/əˌtɜːni ˈdʒenrəl/","pos":"n.","zh":"（美国）司法部长；（英）总检察长","level":"B2","note":"复数常作 attorneys general。acting attorney general 代理司法部长； attorney 在美式英语中即\"律师\"。","examples":[{"en":"President Trump's former lawyer is named the new attorney general.","zh":"特朗普前律师被任命为新任司法部长。","ref":7},{"en":"had been serving as acting attorney general","zh":"一直担任代理司法部长","ref":159}]},{"term":"ally","ipa":"/ˈælaɪ/","pos":"n.","zh":"盟友，支持者","level":"B2","note":"a close ally 亲密盟友；动词 ally with（结盟），注意动词读音 /əˈlaɪ/。","examples":[{"en":"Todd Blanche's appointment puts a close Trump ally","zh":"托德·布兰奇的任命让特朗普的亲信","ref":148}]},{"term":"ouster","ipa":"/ˈaʊstə(r)/","pos":"n.","zh":"罢免，驱逐，下台","level":"C1","note":"动词 oust（罢免）。政治新闻常见：the ouster of the prime minister。","examples":[{"en":"since Pam Bondi's ouster in April","zh":"自帕姆·邦迪四月份被罢免后","ref":160}]},{"term":"skeptical","ipa":"/ˈskeptɪkl/","pos":"adj.","zh":"持怀疑态度的","level":"B2","note":"be skeptical about/of sth。英式拼写 sceptical。名词 skepticism。","examples":[{"en":"to get some skeptical Republicans on board.","zh":"才争取到一些持怀疑态度的共和党人支持。","ref":173}]},{"term":"rescind","ipa":"/rɪˈsɪnd/","pos":"v.","zh":"撤销，废除（决定、法令）","level":"C1","note":"正式用词，常见于法律与政务：rescind a policy/order。名词 rescission。","examples":[{"en":"It's been rescinded, and I am satisfied.","zh":"它已被撤销，我很满意。","ref":179}]},{"term":"primary","ipa":"/ˈpraɪməri/","pos":"n./adj.","zh":"（美国）党内初选；首要的","level":"B2","note":"此处是名词用法：win/lose a primary。形容词义\"主要的\"更常见：primary school, primary concern。","examples":[{"en":"who lost his Republican primary","zh":"他输掉了共和党初选","ref":187}]},{"term":"enclave","ipa":"/ˈenkleɪv/","pos":"n.","zh":"飞地（被别国领土包围的地区）","level":"C1","note":"地理与政治报道用词。文中指西班牙在北非的休达（Ceuta）。","examples":[{"en":"into the Spanish enclave of Suta last week.","zh":"涌入西班牙飞地休达。","ref":218}]},{"term":"reimpose","ipa":"/ˌriːɪmˈpəʊz/","pos":"v.","zh":"重新实施（管控、税收等）","level":"C1","note":"re- + impose。impose controls/sanctions on sth 对……实施管控/制裁。","examples":[{"en":"Italy temporarily reimposed border controls with Spain,","zh":"意大利暂时重新对西班牙实施了边境管控，","ref":219}]},{"term":"defy","ipa":"/dɪˈfaɪ/","pos":"v.","zh":"违抗，无视；使难以（defy description）","level":"B2","note":"defy the rules/orders/EU policy。形容词 defiant（公然违抗的），名词 defiance。","examples":[{"en":"defying the EU's open border policy.","zh":"无视欧盟的开放边境政策。","ref":220}]},{"term":"sanction","ipa":"/ˈsæŋkʃn/","pos":"n.","zh":"制裁；（v.）批准，认可","level":"B2","note":"一词两义需靠语境判断：impose sanctions（实施制裁）vs. sanction a plan（批准计划）。文中为\"制裁\"。","examples":[{"en":"after Rome imposed its own sanctions","zh":"此前罗马方面实施了自身的制裁","ref":228}]},{"term":"breach","ipa":"/briːtʃ/","pos":"n.","zh":"违反，破坏；（防线、堤坝的）缺口","level":"B2","note":"a breach of contract 违约；breach of security 安全漏洞。文中指大批移民\"突破入境\"这一事件。","examples":[{"en":"and suggested they'd played a role in the breach.","zh":"并暗示这些政策在此次入境事件中起了作用。","ref":234}]},{"term":"unhoused","ipa":"/ˌʌnˈhaʊzd/","pos":"adj.","zh":"无家可归的（homeless 的正式/中性说法）","level":"B2","note":"社会新闻中比 homeless 更中性。名词 the unhoused（无家可归者群体）。","examples":[{"en":"Help for the unhoused.","zh":"对无家可归者的援助。","ref":329},{"en":"the ruling could carry implications for unhoused people right across Canada.","zh":"这项裁决可能对全加拿大的无家可归者产生影响。","ref":333}]},{"term":"precedent","ipa":"/ˈpresɪdənt/","pos":"n.","zh":"先例，判例","level":"C1","note":"set a precedent 开创先例；precedent-setting 开创先例的（合成形容词，见第 330 句）。","examples":[{"en":"a potentially precedent-setting court ruling expands supports for people living in tents.","zh":"一项可能开创先例的法庭裁决扩大了对住帐篷者的支持。","ref":330}]},{"term":"allot","ipa":"/əˈlɒt/","pos":"v.","zh":"分配，拨给（时间、金钱、份额）","level":"C1","note":"allot sth to sb / sth。名词 allotment。注意与 a lot 拼写区别。","examples":[{"en":"allotted for accommodation expenses because he lived in a tent.","zh":"因住宿开销而申请的额外社会援助金（原文：分配给住宿开销的款项）。","ref":339}]},{"term":"overturn","ipa":"/ˌəʊvəˈtɜːn/","pos":"v.","zh":"推翻（裁决、决定）；翻倒","level":"B2","note":"法律报道核心动词：overturn a ruling/verdict。近义 reverse（撤销原判）。","examples":[{"en":"The Court of Appeal overturned all the lower rulings and said, yeah,","zh":"上诉法庭推翻了所有下级裁决，并表示，是的，","ref":341}]},{"term":"dignity","ipa":"/ˈdɪɡnəti/","pos":"n.","zh":"尊严，体面","level":"B2","note":"human dignity 人的尊严；with dignity 有尊严地。形容词 dignified。","examples":[{"en":"Money that allows someone some human dignity and a step in stone towards being able to live healthy, normal lives.","zh":"这笔钱能让人拥有些许人的尊严，是朝着能够过上健康、正常生活迈出的坚实一步。","ref":346}]},{"term":"legislation","ipa":"/ˌledʒɪsˈleɪʃn/","pos":"n.","zh":"立法，法规","level":"B2","note":"不可数名词。enact/pass legislation（通过立法），change legislation（修改法规）。动词 legislate。","examples":[{"en":"or to enact the rules as decided by the court or change legislation.","zh":"还是按照法庭的裁决执行规则，或者修改立法。","ref":350}]},{"term":"conservationist","ipa":"/ˌkɒnsəˈveɪʃənɪst/","pos":"n.","zh":"环保人士，自然保护主义者","level":"C1","note":"conservation（保护）+ -ist。同源的 conserve/conservation/conservationist 一起记；注意与 conversation（对话）拼写只差一个字母。","examples":[{"en":"Why this B.C. conservationist just had a species of seahorse named in her honour.","zh":"为何这位卑诗省环保人士获以她的名字命名一种海马。","ref":12}]},{"term":"pioneer","ipa":"/ˌpaɪəˈnɪə(r)/","pos":"v.","zh":"开创，率先做（pioneer a new approach）","level":"B2","note":"名词义\"先驱、开拓者\"更常见。pioneering work/breakthroughs。","examples":[{"en":"We're involved in pioneering a lot of breakthroughs because who doesn't love a seahorse?","zh":"我们参与开创了许多突破，因为谁不喜欢海马呢？","ref":376}]},{"term":"habitat","ipa":"/ˈhæbɪtæt/","pos":"n.","zh":"（动植物的）栖息地，生活环境","level":"B2","note":"habitat loss 栖息地丧失。注意与 habit（习惯）拼写相近但词义无关。","examples":[{"en":"For decades, Amanda Vincent has been working to secure the future of these creatures and their habitats.","zh":"几十年来，阿曼达·文森特一直致力于保护这些生物及其栖息地的未来。","ref":377}]},{"term":"sustainable","ipa":"/səˈsteɪnəbl/","pos":"adj.","zh":"可持续的，不破坏资源的","level":"B2","note":"sustainable development/fishing。动词 sustain（维持），名词 sustainability。","examples":[{"en":"But it's got to be done in sustainable, sensible ways.","zh":"但必须以可持续、合理的方式进行。","ref":383}]},{"term":"convention","ipa":"/kənˈvenʃn/","pos":"n.","zh":"公约，协定；惯例；大会","level":"B2","note":"文中指联合国公约（United Nations conventions）。一词多义要靠语境：惯例 / 会议 / 公约。","examples":[{"en":"right out to United Nations conventions.","zh":"一直到联合国公约。","ref":384}]},{"term":"snout","ipa":"/snaʊt/","pos":"n.","zh":"（猪、海马等动物的）口鼻部，吻部","level":"C1","note":"动物描写用词：a short snout。同段还有 crown（头顶的冠）、spines（棘刺），可一并记忆。","examples":[{"en":"It has a short snout,","zh":"它有一个短吻，","ref":392}]},{"term":"ecology","ipa":"/iˈkɒlədʒi/","pos":"n.","zh":"生态，生态学","level":"B2","note":"形容词 ecological，名词 ecologist（生态学家）。同句的 vulnerabilities（脆弱性）也是环保报道高频词。","examples":[{"en":"Which is to get in the field with my glorious seahorse and actually learn about its ecology and its vulnerabilities","zh":"那就是去野外，与我光荣的海马一起，真正了解它的生态和脆弱性。","ref":397}]},{"term":"threatened","ipa":"/ˈθretnd/","pos":"adj.","zh":"受到威胁的，（物种）濒危的","level":"B2","note":"be threatened with/by。环保语境中 threatened species 是\"受威胁物种\"的正式说法。","examples":[{"en":"Roughly a third of them are known to be threatened.","zh":"已知大约有三分之一的海马物种面临威胁。","ref":400}]},{"term":"hiatus","ipa":"/haɪˈeɪtəs/","pos":"n.","zh":"中断，间歇","level":"C1","note":"after a two-year hiatus 停办两年之后。单复数同形（hiatuses 亦可）。","examples":[{"en":"The Taste of the Danforth in Toronto's Greektown neighbourhood is making a comeback this weekend after a two-year hiatus.","zh":"多伦多希腊城社区的丹佛斯美食节在中断两年后，于本周末回归。","ref":408}]},{"term":"paramount","ipa":"/ˈpærəmaʊnt/","pos":"adj.","zh":"至高无上的，最重要的","level":"C1","note":"be paramount to sb 意为\"对某人最重要\"（比 important 更正式）。of paramount importance 亦常见。","examples":[{"en":"Your safety is paramount.","zh":"你们的安全最重要。","ref":43}]}],"phrases":[{"term":"state of emergency","pos":"n. phrase","zh":"紧急状态","note":"declare a state of emergency 宣布进入紧急状态；province-wide/nationwide 表范围。","example":{"en":"The premier declaring a province-wide state of emergency.","zh":"省长宣布全省进入紧急状态。"},"ref":21},{"term":"on high alert","pos":"prep. phrase","zh":"处于高度戒备状态","note":"也可说 be on full alert / put sb on alert。","example":{"en":"Surrounding areas are now on high alert.","zh":"周边地区现处于高度戒备状态。"},"ref":26},{"term":"evacuation zone / evacuation order","pos":"n. phrase","zh":"疏散区 / 疏散令","note":"under evacuation order 处于疏散令之下。灾害报道高频搭配。","example":{"en":"This is the evacuation zone, the largest so far this year,","zh":"这是今年迄今为止最大的疏散区，"},"ref":24},{"term":"flee for one's life","pos":"v. phrase","zh":"逃命，逃生","note":"one's 随主语变化：fled for their lives。","example":{"en":"as 20,000 people in B.C.'s Okanagan region fled for their lives last night.","zh":"昨晚卑诗省欧肯那根地区两万人逃生的情景。"},"ref":16},{"term":"close call","pos":"n. phrase","zh":"险情，死里逃生，有惊无险","note":"口语常用：That was a close call! 文中指记者本人昨晚险些被火困住。","example":{"en":"you had your own close call last night.","zh":"你昨晚自己也经历了惊险一刻。"},"ref":72},{"term":"turn away","pos":"phrasal v.","zh":"拒绝进入，把……挡回","note":"被动式更常见：were turned away（被拦回）。","example":{"en":"but were turned away because the fire had jumped the highway","zh":"但被拦了回来，因为大火已经越过了公路，"},"ref":88},{"term":"in limbo","pos":"prep. phrase","zh":"悬而未决，处于不确定状态","note":"政治与商务报道常用：The deal is in limbo. ","example":{"en":"For weeks, Blanche's confirmation was in limbo","zh":"数周以来，布兰奇的确认一直悬而未决，"},"ref":162},{"term":"on board","pos":"prep. phrase","zh":"（被）争取到支持，加入阵营","note":"get/keep sb on board；也可指\"在船上/飞机上\"。","example":{"en":"to get some skeptical Republicans on board.","zh":"才争取到一些持怀疑态度的共和党人支持。"},"ref":173},{"term":"at the 11th hour","pos":"prep. phrase","zh":"在最后一刻，千钧一发之际","note":"源自《圣经》比喻，指拖到最后关头才行动或得救。","example":{"en":"At the 11th hour,","zh":"在最后一刻，"},"ref":185},{"term":"slush fund","pos":"n. phrase","zh":"贿赂基金，私设账外资金","note":"政治丑闻报道常用词，含贬义。","example":{"en":"as a slush fund for January 6 rioters.","zh":"这是给 1 月 6 日骚乱者的贿赂基金。"},"ref":168},{"term":"as a last resort","pos":"prep. phrase","zh":"作为最后手段，万不得已时","note":"in the last resort 亦可；反义 as a first resort（首选）。","example":{"en":"but should only do so as a last resort.","zh":"但这只应作为最后的手段。"},"ref":243},{"term":"in the grips of","pos":"prep. phrase","zh":"处于……的控制/困扰之中，正遭受","note":"多接危机、热浪、衰退等：in the grips of a heat wave/recession。","example":{"en":"Parts of Asia are in the grips of a record heat wave.","zh":"亚洲部分地区正遭受创纪录的热浪侵袭。"},"ref":264},{"term":"turn the tide(s)","pos":"v. phrase","zh":"扭转局势，改变走向","note":"the tide turns 局势逆转；a chance to turn the tides 扭转局势的机会。","example":{"en":"But with every discovery brings more understanding and a chance to turn the tides.","zh":"但每一次发现都带来更多理解，以及扭转局势的机会。"},"ref":401},{"term":"make a name for oneself","pos":"v. phrase","zh":"成名，扬名","note":"也可说 make one's name as…（以……成名）。","example":{"en":"A professor from British Columbia is making a name for herself.","zh":"一位来自不列颠哥伦比亚省的教授正声名鹊起。"},"ref":368},{"term":"run deep","pos":"v. phrase","zh":"（情感、影响）根深蒂固，意义深远","note":"文中 in a way that runs deep 意为\"以一种深入人心的方式\"。","example":{"en":"Now her life's work is being recognised in a way that runs deep.","zh":"现在，她一生的工作以一种深刻的方式得到了认可。"},"ref":385},{"term":"jam-packed","pos":"adj.","zh":"挤得水泄不通的，塞满的","note":"口语化形容词：The street was jam-packed with tourists.","example":{"en":"but in 1944, the port town near Romania was jam-packed.","zh":"但在 1944 年，罗马尼亚附近的这个港口城镇曾拥挤不堪。"},"ref":291},{"term":"stepping stone（原文误作 a step in stone）","pos":"n. phrase","zh":"垫脚石，进阶的一步","note":"第 346 句台词本写作 a step in stone，标准表达应为 a stepping stone towards…。听到/读到时按后者理解。","example":{"en":"a step in stone towards being able to live healthy, normal lives.","zh":"朝着能够过上健康、正常生活迈出的坚实一步。"},"ref":346}],"grammar":[{"title":"现在分词作结果状语（…, leaving little time to escape）","structure":"主句 + , + v-ing（逻辑主语＝主句主语）","explain":"分词短语放在句末，说明主句动作带来的自然结果或伴随情况，相当于 and this left… 或 which left…。这是新闻叙述\"一个动作引发另一个后果\"时最经济的写法，本片中反复出现。","examples":[{"en":"A fire, first reported at 5.30 Friday afternoon near the community of Summerland, suddenly exploded in size, leaving little time to escape.","zh":"周五下午 5 点 30 分，夏季兰社区附近首次报告的一场火灾，突然急剧扩大，几乎没有时间逃生。","ref":18},{"en":"As thousands of British Columbians fled the fast-moving flames, closing in on the entire district of Summerland in the Okanagan.","zh":"成千上万的卑诗省民逃离迅速蔓延的火焰，火焰逼近欧肯那根的夏季兰整个地区。","ref":31}],"caution":"分词逻辑主语必须与主句主语一致；若不一致就要改成独立主格（见下一条）或从句，否则成\"悬垂分词\"（dangling participle）。"},{"title":"过去分词作后置定语（a fire, first reported at 5.30…）","structure":"名词 + 过去分词短语（＝省略 which/that is 的定语从句）","explain":"过去分词表被动或已完成，放在名词后作定语，比定语从句更紧凑，是新闻压缩句子的常用手段。若动作是主动、正在进行的，则用现在分词（the retreating Nazi army）。","examples":[{"en":"A fire, first reported at 5.30 Friday afternoon near the community of Summerland,","zh":"周五下午 5 点 30 分首次报告的、夏季兰社区附近的一场火灾","ref":17},{"en":"a so-called hunger stone from the 1800s, a marker placed at the low water level,","zh":"一块来自 19 世纪的所谓\"饥饿石\"，一个设在低水位线的标记","ref":315},{"en":"left behind by the retreating Nazi army","zh":"它是撤退的纳粹军队留下的","ref":285}],"caution":"区分 report（报道）与 reported（被报道）：主动关系用 -ing，被动关系用 -ed，这是分词选择的核心判断标准。"},{"title":"独立主格结构（The premier declaring a state of emergency.）","structure":"名词/代词 + 分词（或形容词、介词短语），整体不带谓语","explain":"分词自带自己的逻辑主语，于是整段成为独立的\"准句子\"。新闻画面解说、标题、逐条播报里极常见，因为要快速罗列多个动作，不必每句都写完整的主谓结构。共性是：它不是一个语法上的完整句子，但语义上自足。","examples":[{"en":"The premier declaring a province-wide state of emergency.","zh":"省长宣布全省进入紧急状态。","ref":21},{"en":"The flames growing in real time on live TV.","zh":"火焰在电视直播中实时蔓延。","ref":39},{"en":"Many evacuees leaving nearly all of their belongings and their livelihoods behind the fire line.","zh":"许多撤离者几乎将所有财物和生计都留在了火线之后。","ref":53}],"caution":"考试写作中独立主格属于\"高级但易错\"结构：主语与分词之间必须是主动关系才用 -ing，被动用 -ed（With the loss of homes, a certainty 属 with 复合结构）。"},{"title":"现在完成时与现在完成进行时：截至目前的累积与持续","structure":"have/has + done；have/has been + doing","explain":"新闻用现在完成时把\"过去发生的事\"与\"现在的影响\"相连：灾害造成的伤亡、创下的纪录、持续的状态。现在完成进行时则强调从过去持续到现在并仍在继续（has been working/has been serving since…）。","examples":[{"en":"one of the fastest fires crews have ever seen.","zh":"这是消防队员见过蔓延最快的火灾之一。","ref":3},{"en":"Why water levels in America's largest reservoir have fallen to record lows.","zh":"为什么美国最大水库的水位会降至历史最低点。","ref":263},{"en":"For decades, Amanda Vincent has been working to secure the future of these creatures and their habitats.","zh":"几十年来，阿曼达·文森特一直致力于保护这些生物及其栖息地的未来。","ref":377}],"caution":"与 since + 时间点、for + 时间段、so far、ever 连用时，必须用完成时，不能用一般现在时。"},{"title":"被动语态：新闻报道的客观化工具","structure":"be + 过去分词（+ by 施事）","explain":"当施事不明、无关紧要或不便点名时，英语新闻倾向用被动：\"is named\"、\"was ordered to evacuate\"、\"are being blamed for\"。它让报道聚焦于事实本身，也让记者不必交代是谁做的。注意时态变化都落在 be 上：is/was/has been/is being。","examples":[{"en":"President Trump's former lawyer is named the new attorney general.","zh":"特朗普前律师被任命为新任司法部长。","ref":7},{"en":"The fires around Summerland and across B.C. are being fueled by hot and dry conditions.","zh":"萨默兰及 BC 省各地的火灾正受到炎热干燥天气的助长。","ref":107},{"en":"The prolonged scorching conditions are being blamed for more than 20 deaths there this year.","zh":"持续的酷热天气被认为是今年那里 20 多人死亡的原因。","ref":266}],"caution":"中文习惯说\"人们认为……\"，英文新闻更常说 It is believed/reported that…；翻译时不要机械对应\"被\"字，如 was ordered to evacuate 译作\"被命令撤离\"即可，而 he was denied the benefits 更自然的是\"他被拒绝给予福利\"→\"申请被驳回\"。"},{"title":"one of the + 最高级 + 复数名词 + (that) 从句","structure":"one of the + 形容词最高级 + 复数名词 + that/省略 + 完成时","explain":"表示\"……中最……的之一\"，从句里常用现在完成时（have ever seen/have ever been），因为含义是\"迄今为止\"。这是写作中替代 very 的高分结构。","examples":[{"en":"from one of the fastest fires crews have ever seen.","zh":"这是消防队员见过蔓延最快的火灾之一。","ref":3},{"en":"This is the evacuation zone, the largest so far this year,","zh":"这是今年迄今为止最大的疏散区，","ref":24}],"caution":"one of 后面必须是复数名词（fires），但在 one of the + 复数名词 + who/that 从句中，从句谓语用复数：one of the fastest fires crews have ever seen。"},{"title":"不定式作目的状语（to get out / to help … get into …）","structure":"主句 + to do；so as to / in order to do","explain":"英语里表\"为了……\"最常用的就是动词不定式，不必加 for。新闻中官方表态、政策目的几乎全用这个结构。","examples":[{"en":"Premier David Eby urging all British Columbians under evacuation order to get out if they haven't already.","zh":"省长大卫·埃比敦促所有收到疏散令的卑诗省民，如果没有撤离，请立即撤离。","ref":59},{"en":"designed to help homeless Nova Scotians get into stable housing.","zh":"旨在帮助无家可归的新斯科舍省人获得稳定住房。","ref":354},{"en":"will want to try and limit the amount of time spent outdoors.","zh":"要尽量减少户外活动时间。","ref":138}],"caution":"urge sb to do sth、help sb (to) do sth：urge 后必须带 to，help 后的 to 可省略——注意第 354 句 help … get 省略了 to。"},{"title":"第二条件句：假设与后果（If they tried…, that would be…）","structure":"If + 一般过去时, 主语 + would/could/might + 动词原形","explain":"谈论与现在事实相反或不太可能的假设。文中律师用这个结构警告政府\"如果他们试图改写法规来破坏这一胜利，那将极其残忍\"——语气克制但立场鲜明。","examples":[{"en":"If they somehow tried to rewrite the regulations to undermine this victory, that would be extremely cruel.","zh":"如果他们试图以某种方式重写法规来破坏这场胜利，那将是极其残忍的。","ref":355},{"en":"because they would have been burnt.","zh":"因为他们早就被烧到了。","ref":37,"note":"这是第三条件句的省略形式（would have been burnt 表与过去事实相反）。"}],"caution":"注意区分：if + 现在时, will（真实条件）／if + 过去时, would（虚拟）／if + 过去完成时, would have done（与过去相反）。"},{"title":"It takes … to do：强调\"代价/时间\"的句式","structure":"It takes sb/sth + 时间/条件 + to do sth","explain":"把\"做某事需要付出什么\"作为信息焦点。文中用它强调布兰奇是\"直到正式终止基金\"才换来支持——句子主语是形式主语 it，真正的主语是后面的不定式。","examples":[{"en":"However, it took Blanche formally terminating the fund Sunday to get some skeptical Republicans on board.","zh":"然而，直到布兰奇周日正式终止该基金，才争取到一些持怀疑态度的共和党人支持。","ref":172},{"en":"It means instead of receiving the base amount, roughly $400 a month,","zh":"这意味着，一个住帐篷的人不应只领取约每月 400 加元的基本金额，","ref":344}],"caution":"句中 take 的宾语可以是动名词（formally terminating the fund），此时 it took … doing 比 it took … to do 更强调\"付出这个动作本身\"。"},{"title":"转述结构：say / warn / report / insist + 宾语从句","structure":"主语 + 转述动词 + (that) + 从句","explain":"新闻报道大量依靠转述他人话语。that 通常省略，从句时态一般与主句保持呼应；若转述的是仍然成立的事实，从句可保留原时态（warned the conditions are explosive）。","examples":[{"en":"And B.C.'s wildfire service warned the conditions are explosive","zh":"卑诗省山火服务处警告称，情况极具爆炸性。","ref":22},{"en":"The union says member states can temporarily introduce controls for serious threats,","zh":"欧盟表示，成员国可在面临严重威胁时临时实施管控，","ref":241},{"en":"The minister insists any changes would be designed to help homeless Nova Scotians get into stable housing.","zh":"部长坚称，任何改变都将旨在帮助无家可归的新斯科舍省人获得稳定住房。","ref":354}],"caution":"常见转述动词的语气强度：say（中性）< state/note < insist/maintain（坚持）< warn（警告）< admit/concede（承认）。写作用它们替换 say 可以显著提高表达精度。"},{"title":"with 复合结构（with + 名词 + 分词/形容词/介词短语）","structure":"with + 宾语 + 宾语补足语（v-ing / v-ed / adj. / prep. phrase）","explain":"用来交代背景、原因或伴随状况，比状语从句简洁。文中记者描述撤离条件、评论员描述灾情时都用到。","examples":[{"en":"Dozens flown out by helicopter with no way out by road.","zh":"数十人因道路不通由直升机接出。","ref":35},{"en":"With the loss of homes, a certainty and any loss of life still a very real possibility.","zh":"随着家园被毁，这是一场确定的灾难，而任何生命损失都仍是非常现实的可能性。","ref":65},{"en":"But with every discovery brings more understanding and a chance to turn the tides.","zh":"但每一次发现都带来更多理解，以及扭转局势的机会。","ref":401,"note":"台词本此处近似口语混用：标准写法可作 Every discovery brings more understanding…。听到时按\"每次发现都带来……\"理解。"}],"caution":"with 结构中的分词同样遵守主动 -ing、被动 -ed 的规则：with the fire burning / with the road blocked。"},{"title":"as 引导的时间与原因状语从句","structure":"As + 从句, 主句（表\"当……时\"或\"因为……\"）","explain":"as 是个\"轻量连接词\"，可表时间（当……时）、原因（由于）、方式（正如）。新闻叙述背景时用它把两个同时发生的事并行推进，比 when/because 更流畅。","examples":[{"en":"As thousands of British Columbians fled the fast-moving flames, closing in on the entire district of Summerland in the Okanagan.","zh":"成千上万的卑诗省民逃离迅速蔓延的火焰，火焰逼近欧肯那根的夏季兰整个地区。","ref":30},{"en":"As you can see, ships can't pass anymore,","zh":"正如你所见，船只无法再通行了，","ref":287},{"en":"as the Nazis came under Soviet fire.","zh":"当纳粹遭到苏联炮火攻击时。","ref":293}],"caution":"区分 as（同时、伴随）、when（某时刻）、while（一段时间，常带对比意味）。"}],"patterns":[{"en":"It exploded with frightening speed and ferocity.","zh":"它以惊人的速度和凶猛程度爆发。","usage":"with + 抽象名词，表示\"以某种方式/程度\"，比副词更有画面感。","rewrite":"可替换为副词：It exploded frighteningly fast and ferociously. 但原文更符合新闻播报的节奏感。","ref":28},{"en":"In just three hours after it first ignited, it's since grown much larger.","zh":"在首次燃起后的短短三小时内，火势已扩大了很多。","usage":"In just + 时间 + after + 事件，用\"短短\"压缩时间、突出对比；since 与现在完成时呼应，强调\"从那以后一直\"。","rewrite":"In just three hours, the fire had grown much larger than when it first ignited.","ref":50},{"en":"What started as a smaller-sized blaze exploded only within hours to thousands of hectares.","zh":"一开始还是一场规模较小的火灾，仅仅几小时内就爆发式地蔓延到数千公顷。","usage":"What started as A + 动词 + to B：\"起初是 A，后来变成 B\"，用于叙述升级、演变，写作与口语都很好用。","rewrite":"What began as a small fire grew into a blaze covering thousands of hectares.","ref":75},{"en":"New details on the wildfire fight and the forecast.","zh":"关于山火扑救和天气预报的最新细节。","usage":"名词短语作导语：New details on X and Y. 省略动词，适合做标题或段落开头，后面再展开。","rewrite":"Here are the latest details on how crews are fighting the wildfire and what the forecast looks like.","ref":6},{"en":"We've seen dozens, if not more, volunteers going car to car.","zh":"我们看到几十名（甚至更多）志愿者在停车场里挨车询问。","usage":"插入语 if not more / if not all：\"即使不是更多，至少也……\"，用来给数量留余地，同时暗示实际可能更多。","rewrite":"now most, if not all, large parking lots in Penticton are full of campers…（第 91 句，同一结构）","ref":100},{"en":"The prolonged scorching conditions are being blamed for more than 20 deaths there this year.","zh":"持续的酷热天气被认为是今年那里 20 多人死亡的原因。","usage":"X is being blamed for Y：把责任/原因归于 X，被动进行时表示\"目前正被这样归因\"。","rewrite":"Officials blame the prolonged heat for more than 20 deaths there this year.","ref":266},{"en":"Parts of Asia are in the grips of a record heat wave.","zh":"亚洲部分地区正遭受创纪录的热浪侵袭。","usage":"be in the grips of + 危机类名词（heat wave / recession / crisis），比 suffer from 更有\"被攫住\"的画面感。","rewrite":"Parts of Asia are suffering from a record heat wave.","ref":264},{"en":"It's pretty wonderful to wake up and open your email and discover…","zh":"醒来打开邮件就发现……真是太美好了。","usage":"It is + 形容词 + to do：把评价放前面、事实放后面，口语中极常用，比直接说 I am happy that… 更自然。","rewrite":"Waking up to that news made her day.","ref":389},{"en":"Amanda Vincent has been working to secure the future of these creatures and their habitats.","zh":"阿曼达·文森特一直致力于保护这些生物及其栖息地的未来。","usage":"has been working to do：现在完成进行时 + 不定式，表示\"长期以来一直致力于\"，用来介绍人物贡献的标准句式。","rewrite":"She has devoted decades to securing the future of these creatures.","ref":377},{"en":"a potentially precedent-setting court ruling expands supports for people living in tents","zh":"一项可能开创先例的法庭裁决扩大了对住帐篷者的支持。","usage":"前置定语链（potentially precedent-setting）+ 动词 expands supports for：新闻里常见\"形容词/副词 + 合成形容词 + 名词\"的密集信息结构。","rewrite":"A court ruling that could set a precedent expands support for people who live in tents.","ref":330}],"exercises":[{"type":"choice","question":"根据第 2 句 \"More than 20,000 residents … forced to evacuate\"，evacuate 的意思是：","options":["撤离、疏散","淹没、覆盖","评估、估价","加剧、恶化"],"answer":"A","explain":"evacuate = 把人从危险地区撤走；名词 evacuation。注意与 evaluate（评估）、inundate（淹没）拼写相近但无关。"},{"type":"fill","question":"More than 20,000 residents ______ (force) to evacuate overnight.（用正确形式填空）","answer":["were forced"],"explain":"居民是\"被命令撤离\"的承受者，用被动语态；时间指向过去（overnight），故用一般过去时的被动 were forced。"},{"type":"choice","question":"The fire suddenly exploded in size, ______ little time to escape.（第 18 句）","options":["leaving","left","to leave","leaves"],"answer":"A","explain":"逗号后接现在分词短语作结果状语，逻辑主语是 the fire，与 leave 是主动关系，相当于 and this left little time to escape。"},{"type":"fill","question":"B.C.'s wildfire service warned the conditions ______ explosive.（用 be 动词的正确形式填空，第 22 句）","answer":["are"],"explain":"warned 是过去式，但转述的是\"现在依然成立\"的事实（火险条件仍具爆炸性），从句可用现在的 are；这类从句时态不必与主句一致。"},{"type":"fill","question":"The premier ______ (declare) a province-wide state of emergency.（第 21 句，独立主格结构）","answer":["declaring"],"explain":"这里没有谓语动词，是\"名词 + 现在分词\"的独立主格结构，用于新闻逐条播报；分词自带主语 the premier，用主动形式 declaring。"},{"type":"choice","question":"The fires around Summerland and across B.C. ______ hot and dry conditions.（第 107 句）","options":["are being fueled by","are fueling by","being fueled","have fueled"],"answer":"A","explain":"be being + 过去分词是\"被动语态的进行时\"，表示火势目前正被炎热干燥天气助长；fuel 在此处作动词，意为\"助长、加剧\"。"},{"type":"fill","question":"Temperatures will ______ into the low 30s on Sunday.（第 132 句，填一个表示\"飙升\"的动词）","answer":["soar"],"explain":"soar 专用于价格、气温等\"急剧上升\"；同段另有 drop（下降）、pick up（风力增强）可对比记忆。"},{"type":"choice","question":"Surrounding areas are now on high ______.（第 26 句，选择合适的搭配）","options":["alert","alarm","warning","attention"],"answer":"A","explain":"固定搭配 on high alert = 处于高度戒备状态。on the alert 亦可，但不能说 on high alarm/warning/attention。"},{"type":"fill","question":"For weeks, Blanche's confirmation was in ______ before the vote.（第 162 句，填一个表示\"悬而未决\"的词）","answer":["limbo"],"explain":"in limbo 指\"处于不确定、悬而未决的状态\"，政治与商务报道中的固定说法。"},{"type":"choice","question":"\"It's been rescinded, and I am satisfied.\"（第 179 句）其中 rescind 的意思是：","options":["撤销、废除","重申、强调","保留、维持","签署、批准"],"answer":"A","explain":"rescind 是正式用词，指撤销决定、法令或命令；本句中那位参议员正因该基金被废除而表示满意。"},{"type":"choice","question":"The Taste of the Danforth is making a comeback this weekend after a two-year ______.（第 408 句）","options":["hiatus","height","highlight","heritage"],"answer":"A","explain":"after a two-year hiatus = 中断两年之后；hiatus 指\"间歇、中断\"，是一个 C1 级别的正式词。"},{"type":"fill","question":"Amanda Vincent has conducted decades of research and ______ (conserve) efforts for marine life.（第 369 句，用正确形式填空）","answer":["conservation"],"explain":"and 连接两个并列名词短语：research and conservation efforts，所以要用名词 conservation（保护），而不是动词 conserve。"},{"type":"translate","question":"翻译成英文：在首次燃起后的短短三小时内，火势已扩大了很多。（提示：In just three hours after…)","answer":["In just three hours after it first ignited, it has since grown much larger."],"explain":"参考原文第 50 句。注意\"短短三小时内\"用 In just three hours；\"已扩大\"用现在完成时 has grown，配合 since 表示\"此后一直\"。"},{"type":"translate","question":"翻译成英文：这项裁决可能对全加拿大的无家可归者产生影响。（提示：carry implications for…）","answer":["The ruling could carry implications for unhoused people right across Canada."],"explain":"参考原文第 333 句。carry implications for sb 意为\"对某人产生影响\"；right across Canada 的 right 起强调作用，= 遍及全加拿大。"},{"type":"translate","question":"翻译成英文：海马承受着巨大的压力，已知大约有三分之一面临威胁。（提示：under pressure / be known to be…)","answer":["Seahorses are under tremendous pressure, and roughly a third of them are known to be threatened."],"explain":"参考原文第 399–400 句。under tremendous pressure = 承受巨大压力；roughly a third of them = 大约三分之一；be known to be threatened 是\"已知处于受威胁状态\"。"}]}</script>
